name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push cancels the run still going for the same branch or PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Reads the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # Also runs `prisma generate` (apps/api postinstall).
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      # The API lint script uses --fix: fail if it changed files that were not committed.
      - name: Check for uncommitted lint fixes
        run: git diff --exit-code

      - run: pnpm check-types
      # Unit tests only. The API e2e suite needs a database and runs locally.
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: E2E (mock mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      # The web runs against MSW mocks, so no API, database or secrets are needed.
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
